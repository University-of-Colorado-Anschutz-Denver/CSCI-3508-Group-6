<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Clone and verify a repository in PowerShell</title>
  <desc id="desc">Illustration of Windows PowerShell showing git clone, cd, git status, and git remote commands with successful output.</desc>
  <rect width="1200" height="675" fill="#111827"/>
  <rect x="50" y="45" width="1100" height="580" rx="12" fill="#0c0c0c" stroke="#374151" stroke-width="2"/>
  <rect x="50" y="45" width="1100" height="48" rx="12" fill="#202020"/>
  <circle cx="82" cy="69" r="7" fill="#ff5f57"/>
  <circle cx="106" cy="69" r="7" fill="#febc2e"/>
  <circle cx="130" cy="69" r="7" fill="#28c840"/>
  <text x="520" y="76" fill="#e5e7eb" font-family="Segoe UI, Arial" font-size="15">Windows PowerShell</text>
  <text x="76" y="128" fill="#5eead4" font-family="Consolas, monospace" font-size="17">PS C:\Users\Student\Documents&gt;</text>
  <text x="405" y="128" fill="#f9fafb" font-family="Consolas, monospace" font-size="17">git clone https://github.com/COURSE-ORG/team-07-project.git</text>
  <text x="76" y="164" fill="#d1d5db" font-family="Consolas, monospace" font-size="16">Cloning into 'team-07-project'...</text>
  <text x="76" y="194" fill="#d1d5db" font-family="Consolas, monospace" font-size="16">remote: Enumerating objects: 24, done.</text>
  <text x="76" y="224" fill="#d1d5db" font-family="Consolas, monospace" font-size="16">Receiving objects: 100% (24/24), done.</text>
  <text x="76" y="272" fill="#5eead4" font-family="Consolas, monospace" font-size="17">PS C:\Users\Student\Documents&gt;</text>
  <text x="405" y="272" fill="#f9fafb" font-family="Consolas, monospace" font-size="17">cd team-07-project</text>
  <text x="76" y="320" fill="#5eead4" font-family="Consolas, monospace" font-size="17">PS ...\team-07-project&gt;</text>
  <text x="367" y="320" fill="#f9fafb" font-family="Consolas, monospace" font-size="17">git status</text>
  <text x="76" y="356" fill="#d1d5db" font-family="Consolas, monospace" font-size="16">On branch main</text>
  <text x="76" y="386" fill="#86efac" font-family="Consolas, monospace" font-size="16">Your branch is up to date with 'origin/main'.</text>
  <text x="76" y="416" fill="#d1d5db" font-family="Consolas, monospace" font-size="16">nothing to commit, working tree clean</text>
  <text x="76" y="464" fill="#5eead4" font-family="Consolas, monospace" font-size="17">PS ...\team-07-project&gt;</text>
  <text x="367" y="464" fill="#f9fafb" font-family="Consolas, monospace" font-size="17">git remote -v</text>
  <text x="76" y="500" fill="#d1d5db" font-family="Consolas, monospace" font-size="15">origin  https://github.com/COURSE-ORG/team-07-project.git (fetch)</text>
  <text x="76" y="530" fill="#d1d5db" font-family="Consolas, monospace" font-size="15">origin  https://github.com/COURSE-ORG/team-07-project.git (push)</text>
  <rect x="62" y="105" width="1053" height="448" rx="8" fill="none" stroke="#f2cc60" stroke-width="3"/>
  <circle cx="1121" cy="116" r="24" fill="#f2cc60"/>
  <text x="1114" y="124" fill="#111827" font-family="Segoe UI, Arial" font-size="22" font-weight="700">4</text>
  <text x="72" y="654" fill="#e5e7eb" font-family="Segoe UI, Arial" font-size="15">Clone, enter the folder, and confirm the branch and origin URL before editing.</text>
</svg>
