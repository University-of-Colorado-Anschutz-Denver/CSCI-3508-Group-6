<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Use this template menu on a GitHub repository</title>
  <desc id="desc">Illustration of a GitHub repository page with the Use this template button and Create a new repository option highlighted.</desc>
  <rect width="1200" height="675" fill="#0d1117"/>
  <rect width="1200" height="64" fill="#010409"/>
