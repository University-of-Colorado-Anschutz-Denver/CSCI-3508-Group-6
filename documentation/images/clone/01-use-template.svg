  <text x="764" y="320" fill="#f0f6fc" font-family="Segoe UI, Arial" font-size="14" font-weight="600">Create a new repository</text>
  <text x="764" y="344" fill="#8b949e" font-family="Segoe UI, Arial" font-size="12">Start a new project with this</text>
  <text x="764" y="362" fill="#8b949e" font-family="Segoe UI, Arial" font-size="12">repository's files and structure.</text>
  <rect x="731" y="223" width="294" height="182" rx="10" fill="none" stroke="#f2cc60" stroke-width="4"/>
