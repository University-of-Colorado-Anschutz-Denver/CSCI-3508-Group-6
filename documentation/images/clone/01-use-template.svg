  <text x="179" y="115" fill="#58a6ff" font-family="Segoe UI, Arial" font-size="20" font-weight="600">intro-software-engineering-project-template</text>
  <rect x="660" y="94" width="67" height="24" rx="12" fill="none" stroke="#30363d"/>
