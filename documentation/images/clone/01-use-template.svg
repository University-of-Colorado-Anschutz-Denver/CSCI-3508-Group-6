  <text x="180" y="187" fill="#8b949e" font-family="Segoe UI, Arial" font-size="15">Pull requests</text>
  <line x1="31" y1="204" x2="84" y2="204" stroke="#f78166" stroke-width="2"/>
  <rect x="38" y="234" width="1124" height="330" rx="7" fill="#0d1117" stroke="#30363d"/>
  <rect x="38" y="234" width="1124" height="58" rx="7" fill="#161b22"/>
  <rect x="754" y="247" width="168" height="34" rx="6" fill="#238636" stroke="#2ea043"/>
  <text x="773" y="269" fill="#ffffff" font-family="Segoe UI, Arial" font-size="14" font-weight="600">Use this template</text>
  <path d="M900 261 l5 6 l5 -6" fill="none" stroke="#fff" stroke-width="2"/>
  <rect x="936" y="247" width="92" height="34" rx="6" fill="#238636" stroke="#2ea043"/>
  <text x="966" y="269" fill="#ffffff" font-family="Segoe UI, Arial" font-size="14" font-weight="600">Code</text>
