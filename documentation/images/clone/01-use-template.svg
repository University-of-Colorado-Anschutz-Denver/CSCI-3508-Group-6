  <text x="67" y="332" fill="#f0f6fc" font-family="Segoe UI, Arial" font-size="17" font-weight="600">README.md</text>
  <text x="67" y="378" fill="#8b949e" font-family="Consolas, monospace" font-size="15">documentation/</text>
