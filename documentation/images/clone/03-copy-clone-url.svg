<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Copy an HTTPS clone URL from GitHub</title>
  <desc id="desc">Illustration of a GitHub repository Code menu with the HTTPS URL and copy button highlighted.</desc>
  <rect width="1200" height="675" fill="#0d1117"/>
  <rect width="1200" height="64" fill="#010409"/>
  <circle cx="38" cy="32" r="17" fill="#f0f6fc"/>
  <text x="70" y="39" fill="#f0f6fc" font-family="Segoe UI, Arial" font-size="22" font-weight="600">GitHub</text>
  <text x="34" y="115" fill="#58a6ff" font-family="Segoe UI, Arial" font-size="20">COURSE-ORG</text>
  <text x="162" y="115" fill="#8b949e" font-family="Segoe UI, Arial" font-size="20">/</text>
  <text x="179" y="115" fill="#58a6ff" font-family="Segoe UI, Arial" font-size="20" font-weight="600">team-07-project</text>
  <line x1="0" y1="148" x2="1200" y2="148" stroke="#21262d"/>
  <text x="38" y="187" fill="#f0f6fc" font-family="Segoe UI, Arial" font-size="15" font-weight="600">Code</text>
  <line x1="31" y1="204" x2="84" y2="204" stroke="#f78166" stroke-width="2"/>
  <rect x="38" y="232" width="1124" height="326" rx="7" fill="#0d1117" stroke="#30363d"/>
  <rect x="1006" y="247" width="120" height="36" rx="6" fill="#238636" stroke="#2ea043"/>
  <text x="1041" y="270" fill="#ffffff" font-family="Segoe UI, Arial" font-size="14" font-weight="600">Code</text>
  <path d="M1102 261 l5 6 l5 -6" fill="none" stroke="#fff" stroke-width="2"/>
  <rect x="648" y="291" width="478" height="250" rx="9" fill="#161b22" stroke="#8c959f"/>
  <text x="672" y="326" fill="#f0f6fc" font-family="Segoe UI, Arial" font-size="16" font-weight="600">Clone</text>
  <text x="672" y="366" fill="#f0f6fc" font-family="Segoe UI, Arial" font-size="14" font-weight="600">HTTPS</text>
  <text x="752" y="366" fill="#8b949e" font-family="Segoe UI, Arial" font-size="14">SSH</text>
  <text x="803" y="366" fill="#8b949e" font-family="Segoe UI, Arial" font-size="14">GitHub CLI</text>
  <line x1="670" y1="378" x2="731" y2="378" stroke="#f78166" stroke-width="2"/>
  <rect x="672" y="397" width="423" height="38" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="2"/>
  <text x="688" y="421" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12">https://github.com/COURSE-ORG/team-07-project.git</text>
  <rect x="1058" y="398" width="36" height="36" rx="5" fill="#21262d" stroke="#8c959f"/>
  <rect x="1071" y="408" width="11" height="13" rx="1" fill="none" stroke="#f0f6fc"/>
  <path d="M1067 414 v-10 h11" fill="none" stroke="#f0f6fc"/>
  <text x="672" y="466" fill="#8b949e" font-family="Segoe UI, Arial" font-size="12">Use Git or checkout with SVN using the web URL.</text>
  <rect x="657" y="384" width="452" height="67" rx="9" fill="none" stroke="#f2cc60" stroke-width="4"/>
  <circle cx="1144" cy="417" r="24" fill="#f2cc60"/>
  <text x="1137" y="425" fill="#0d1117" font-family="Segoe UI, Arial" font-size="22" font-weight="700">3</text>
  <text x="67" y="324" fill="#f0f6fc" font-family="Segoe UI, Arial" font-size="17" font-weight="600">Confirm this is your team's repository.</text>
  <text x="67" y="361" fill="#8b949e" font-family="Segoe UI, Arial" font-size="15">Then select Code, HTTPS, and the copy icon.</text>
  <rect x="38" y="605" width="1124" height="42" rx="6" fill="#161b22"/>
  <text x="58" y="632" fill="#c9d1d9" font-family="Segoe UI, Arial" font-size="15">Copy the URL exactly. Do not type it from memory.</text>
</svg>
