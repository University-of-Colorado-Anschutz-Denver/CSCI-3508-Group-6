server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header is not inherited once a location sets its own, so every
    # location includes the shared headers explicitly.
    include /etc/nginx/conf.d/security-headers.inc;

    location = /healthz {
        include /etc/nginx/conf.d/security-headers.inc;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Always revalidate: pages and the release data change on every deploy.
    location ~* \.(html|json)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|ico|webp)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ =404;
    }
}
